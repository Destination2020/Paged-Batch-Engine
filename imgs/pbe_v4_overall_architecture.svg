<text x="2061" y="651" class="body" fill="#10244c" text-anchor="start">PBE C++ / CUDA</text>
<text x="2061" y="679" class="body" fill="#10244c" text-anchor="start">Restore KV / generate</text>
<text x="2061" y="707" class="body" fill="#10244c" text-anchor="start">Uses engine core at left</text>
<line x1="2007" y1="655" x2="2043" y2="655" stroke="#527391"/>
<polygon points="2043,655 2031,648 2031,662" fill="#527391"/>
<text x="2025" y="762" class="small" fill="#526782" text-anchor="middle">P→D handoff carries identity, generation and page metadata.</text>
<text x="2025" y="797" class="small" fill="#526782" text-anchor="middle">Same-GPU IPC / cross-GPU copy are separate paths.</text>
<text x="2025" y="824" class="small" fill="#526782" text-anchor="middle">Shared weights: same GPU + compatible model / layout.</text>
<line x1="370" y1="323" x2="400" y2="323" stroke="#2563a0"/>
<polygon points="400,323 388,316 388,330" fill="#2563a0"/>
