<line x1="555" y1="676" x2="555" y2="655" stroke="#b56a16"/>
<polygon points="555,655 548,667 562,667" fill="#b56a16"/>
<text x="1065" y="891" class="small" fill="#526782" text-anchor="middle">Batch metadata → model; logits → sampler; sampled outputs advance Scheduler state.</text>
<rect x="40" y="923" width="2320" height="488" rx="20" fill="#f8f5ff" stroke="#6b46c1"/>
<text x="62" y="963" class="heading" fill="#6b46c1" text-anchor="start">05  SHARED DATA, PAGED CACHE &amp; RESOURCE LIFECYCLE</text>
<text x="62" y="994" class="small" fill="#526782" text-anchor="start">Workers manage logical execution views; framework owners manage shared physical allocations and grants.</text>
<line x1="865" y1="858" x2="865" y2="923" stroke="#6b46c1"/>
<polygon points="865,923 858,911 872,911" fill="#6b46c1"/>
<line x1="2025" y1="858" x2="2025" y2="923" stroke="#6b46c1"/>
<polygon points="2025,923 2018,911 2032,911" fill="#6b46c1"/>
<text x="880" y="916" class="small" fill="#6b46c1" text-anchor="start">Page tables / checkpoint dependencies</text>
<text x="2040" y="916" class="small" fill="#6b46c1" text-anchor="start">Acquire / publish / release</text>
<rect x="60" y="1020" width="545" height="220" rx="14" fill="#ffffff" stroke="#d6dfeb"/>
<text x="78" y="1053" class="heading" fill="#6b46c1" text-anchor="start">Data service / Node Agent</text>
<text x="78" y="1084" class="body" fill="#10244c" text-anchor="start">ContentRegistry • DataClient • typed wire protocol</text>
<text x="78" y="1112" class="body" fill="#10244c" text-anchor="start">Content / representation / allocation identities</text>
<text x="78" y="1140" class="body" fill="#10244c" text-anchor="start">Generation-bound leases • idempotent operations</text>
<text x="78" y="1168" class="body" fill="#10244c" text-anchor="start">CUDA IPC pool and shared-weight owner</text>
<text x="78" y="1196" class="body" fill="#10244c" text-anchor="start">TensorBundle: features + request-specific metadata</text>
<rect x="625" y="1020" width="545" height="220" rx="14" fill="#ffffff" stroke="#d6dfeb"/>
<text x="643" y="1053" class="heading" fill="#6b46c1" text-anchor="start">KVCacheManager &amp; prefix reuse</text>
<text x="643" y="1084" class="body" fill="#10244c" text-anchor="start">Per-request page tables • grants / pool views</text>
<text x="643" y="1112" class="body" fill="#10244c" text-anchor="start">Semantic multimodal prefix identity</text>
<text x="643" y="1140" class="body" fill="#10244c" text-anchor="start">Longest continuous prefix • missing-page fetch</text>
<text x="643" y="1168" class="body" fill="#10244c" text-anchor="start">Radix index • shared prefix • tail-page COW</text>
<text x="643" y="1196" class="body" fill="#10244c" text-anchor="start">New content or position semantics → distinct KV</text>
<rect x="1190" y="1020" width="545" height="220" rx="14" fill="#ffffff" stroke="#d6dfeb"/>
<text x="1208" y="1053" class="heading" fill="#6b46c1" text-anchor="start">Tiering &amp; physical transfer</text>
<text x="1208" y="1084" class="body" fill="#10244c" text-anchor="start">PageDirectory • HostStore • PageMigration</text>
<text x="1208" y="1112" class="body" fill="#10244c" text-anchor="start">TransferScheduler • singleflight</text>
<text x="1208" y="1140" class="body" fill="#10244c" text-anchor="start">Demand / prefetch / background lanes</text>
<text x="1208" y="1168" class="body" fill="#10244c" text-anchor="start">GPU ↔ Host • dependency-aware recovery</text>
<text x="1208" y="1196" class="body" fill="#10244c" text-anchor="start">Cross-GPU copy is measured data movement</text>
<rect x="1755" y="1020" width="585" height="220" rx="14" fill="#ffffff" stroke="#d6dfeb"/>
<text x="1773" y="1053" class="heading" fill="#6b46c1" text-anchor="start">Memory budget &amp; safety</text>
<text x="1773" y="1084" class="body" fill="#10244c" text-anchor="start">Weights + KV + workspace + staging + features</text>
<text x="1773" y="1112" class="body" fill="#10244c" text-anchor="start">Shared physical weights counted once</text>
<text x="1773" y="1140" class="body" fill="#10244c" text-anchor="start">Private state and CUDA overhead counted separately</text>
<text x="1773" y="1168" class="body" fill="#10244c" text-anchor="start">Producer / consumer completion fences</text>
<text x="1773" y="1196" class="body" fill="#10244c" text-anchor="start">Drain / release / quarantine / fail-stop recovery</text>
<rect x="60" y="1261" width="2280" height="123" rx="14" fill="#eee8fa" stroke="#ded3f3"/>
<text x="85" y="1295" class="heading" fill="#6b46c1" text-anchor="start">PHYSICAL OWNERSHIP</text>
<text x="85" y="1330" class="body" fill="#10244c" text-anchor="start">Shared weight allocation  |  Agent-owned KV pages  |  Feature / request bundles  |  Host recovery copies</text>
<text x="85" y="1362" class="body" fill="#10244c" text-anchor="start">Immutable views may be shared; workspace, activations, scheduler state and writable tails stay private to their consumers.</text>
<rect x="40" y="1441" width="1130" height="158" rx="20" fill="#f4f6f9" stroke="#526782"/>
<text x="62" y="1481" class="heading" fill="#526782" text-anchor="start">06  DEPLOYMENT &amp; COMPATIBILITY</text>
<text x="62" y="1512" class="small" fill="#526782" text-anchor="start">Single-node V4: TP=1, image + text, trusted processes</text>
<text x="62" y="1545" class="body" fill="#10244c" text-anchor="start">Launchers: Data service + Vision + persistent P / D • same-GPU IPC / cross-GPU copy</text>
<text x="62" y="1576" class="body" fill="#10244c" text-anchor="start">Legacy serving_qwen modes retained: local P+D • P2P • ZMQ / NCCL (build-dependent)</text>
<rect x="1200" y="1441" width="1160" height="158" rx="20" fill="#f4f6f9" stroke="#526782"/>
<text x="1222" y="1481" class="heading" fill="#526782" text-anchor="start">07  VALIDATION &amp; OBSERVABILITY</text>
<text x="1222" y="1512" class="small" fill="#526782" text-anchor="start">Correctness / faults / resources / performance are separate gates</text>
<text x="1222" y="1545" class="body" fill="#10244c" text-anchor="start">C++ / CUDA tests • real VLM numerics • lifecycle faults • compute-sanitizer</text>
<text x="1222" y="1576" class="body" fill="#10244c" text-anchor="start">Request traces • memory accounting • repeated A/B • raw evidence / manifests</text>
<text x="40" y="1641" class="small" fill="#526782" text-anchor="start">Architecture map, not a performance claim. No implication of arbitrary TP, cross-node RDMA or unrestricted multi-P/D scaling.</text>
<text x="2360" y="1641" class="small" fill="#526782" text-anchor="end">PAGED BATCH ENGINE</text></svg>
